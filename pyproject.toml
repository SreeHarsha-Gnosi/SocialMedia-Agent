[project]
name = "socialmedia-agent"
version = "0.1.0"
description = "Claude-powered agent that turns documents into Instagram carousels and Telegram/WhatsApp messages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "streamlit>=1.40",
    "pillow>=10.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.15.0",
    "youtube-transcript-api>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socialagent"]
